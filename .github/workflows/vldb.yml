name: Competition validation

on:
  push:
    branches: [competition/tasks-1-4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Install build and SQL client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake binutils m4 libtool-bin libncurses5 rpm rpm2cpio cpio default-mysql-client
      - name: Initialize and build
        run: |
          ./build.sh release --init
          python3 unittest/sql/parser/test_parser_generation_cache.py
          make -C build_release -j2 seekdb sql_tests storage_tests share_tests
      - name: Run focused native regressions
        env:
          GTEST_FILTER: FileSql*:FileDescribeParser.*:*AiColumn*:*AIColumn*:ObAIPromptTest.*:ObOpenAIUtilsTest.*:FileTableColumns.*:IkCharacterClassification.*:EnglishNormalization.*
        run: |
          ./build_release/unittest/run_tests.sh -R '^(sql|storage|share)_tests_shard_[0-9]+$' --output-on-failure
      - name: Start a disposable instance and Mock AI service
        run: |
          mkdir -p "$RUNNER_TEMP/seekdb-competition"
          build_release/src/observer/seekdb --nodaemon --port=2885 \
            --base-dir="$RUNNER_TEMP/seekdb-competition" \
            --parameter cpu_count=2 --parameter memory_limit=2G \
            > "$RUNNER_TEMP/seekdb-competition/server.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/seekdb-competition/server.pid"
          python3 tools/deploy/mysql_test/test_suite/ai_function/mock_ai_service.py \
            --host 127.0.0.1 --port 18000 \
            > "$RUNNER_TEMP/seekdb-competition/mock.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/seekdb-competition/mock.pid"
          for attempt in $(seq 1 120); do
            if version=$(mysql --no-defaults -h127.0.0.1 -P2885 -uroot -N -s -e 'SELECT @@version_comment'); then
              if [[ "$version" == *"$(git rev-parse HEAD)"* ]]; then
                mysql --no-defaults -h127.0.0.1 -P2885 -uroot -e 'CREATE DATABASE IF NOT EXISTS test'
                exit 0
              fi
            fi
            kill -0 "$(cat "$RUNNER_TEMP/seekdb-competition/server.pid")"
            sleep 2
          done
          exit 1
      - name: Validate AI requests and native file SQL
        run: |
          python3 unittest/sql/engine/expr/test_ai_function_protocol.py --client "$(command -v mysql)" --port 2885 --mock-port 18000
          python3 unittest/sql/engine/basic/test_file_sql_protocol.py --client "$(command -v mysql)" --port 2885
      - name: Run the unchanged full FTS benchmark
        env:
          MYSQL: mysql -h127.0.0.1 -P2885 -uroot -N -s -A --default-character-set=utf8mb4
          MYSQL_VERBOSE: mysql -h127.0.0.1 -P2885 -uroot -A --default-character-set=utf8mb4
          LABEL: github-actions
          ROWS: 20000
          BATCH: 500
          ROUNDS: 3000
          QUERY_ROUNDS: 200
          SAMPLES: 3
          WARMUP: 30
          SKIP_LOAD: 0
        run: |
          export OUTPUT="$RUNNER_TEMP/seekdb-competition/fts-report.txt"
          bash tools/benchmark/fts_large_bench.sh
          python3 tools/benchmark/fts_large_bench_score.py "$OUTPUT" --json \
            > "$RUNNER_TEMP/seekdb-competition/fts-score.json"
      - name: Stop disposable processes
        if: always()
        run: |
          for name in server mock; do
            file="$RUNNER_TEMP/seekdb-competition/$name.pid"
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-validation
          path: |
            ${{ runner.temp }}/seekdb-competition/*.out
            ${{ runner.temp }}/seekdb-competition/fts-*
            ${{ runner.temp }}/seekdb-competition/log/seekdb.log
            build_release/Testing/Temporary/LastTest.log
            src/sql/parser/_gen_parser.error
          retention-days: 7
